name: Build

# Builds the classic99 solution on a hosted Windows runner.
#
# Why this needs a couple of overrides:
#  - classic99.vcxproj and cartpack.vcxproj hardcode the "v141_xp" platform
#    toolset (the Windows-XP-compatible variant of the VS2017 compiler).
#    That XP add-on isn't installed on GitHub's runners (and hasn't been
#    easily obtainable from Microsoft in years), so we override the
#    toolset to v143 (VS2022, which the runner does have) at the command
#    line. MSBuild global properties (-p: on the command line) can't be
#    overridden back by the project file, so this cleanly wins over the
#    hardcoded value without editing any .vcxproj files.
#  - The project also hardcodes some old, machine-specific SDK paths
#    (Windows SDK 7.1A, DirectX SDK June 2010). Those directories don't
#    exist on the runner, but they're just extra entries tacked onto the
#    normal include/lib search path, so the compiler quietly skips them
#    and falls back to the regular Windows SDK that ships with the
#    runner's Visual Studio install - nothing to do there.
#
# Win32 is built because it's the "complete" configuration - the x64
# configuration doesn't build FilterDLL.dll or hq4xdll.dll at all (see
# classic99.sln - they have no Build.0 entry for Release|x64), matching
# how the project's own dist/classic99.zip ships fewer files under x64/.
# x64 is still built here too, for parity with what's actually shipped.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We deliberately don't touch the pre-existing VS install on the
      # runner (C:\Program Files\Microsoft Visual Studio\18\Enterprise) -
      # trying to `modify` it in place proved flaky (invalid-argument and
      # hang failures across several attempts). Instead we install a
      # second, self-contained VS Build Tools instance with ATL included
      # from the start, and point MSBuild at that one explicitly.
      - name: Install a self-contained VS Build Tools with ATL
        shell: cmd
        run: >
          choco install visualstudio2022-workload-vctools -y --no-progress
          --package-parameters "--add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --includeRecommended --quiet --norestart"

      - name: Locate MSBuild (the instance that actually has ATL)
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instances = & $vswhere -all -products * -format json | ConvertFrom-Json
          Write-Host "Found $($instances.Count) VS instance(s):"
          $instances | ForEach-Object { Write-Host " - $($_.installationPath) ($($_.displayName) $($_.installationVersion))" }

          $target = $null
          foreach ($inst in $instances) {
            $hit = Get-ChildItem -Path $inst.installationPath -Filter atlstr.h -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) {
              Write-Host "ATL found under: $($inst.installationPath) -> $($hit.FullName)"
              $target = $inst
              break
            }
          }
          if (-not $target) {
            throw "No VS instance with ATL (atlstr.h) found among the $($instances.Count) instance(s) above"
          }

          $msbuildPath = Get-ChildItem -Path $target.installationPath -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Current\\Bin\\' -or $_.FullName -match '\\Bin\\' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $msbuildPath) {
            throw "Found a VS instance with ATL at $($target.installationPath) but couldn't locate MSBuild.exe under it"
          }
          Write-Host "Using MSBuild: $msbuildPath"
          echo "path=$msbuildPath" >> $env:GITHUB_OUTPUT

      - name: Build classic99.sln (Release|${{ matrix.platform }})
        run: >
          & "${{ steps.msbuild.outputs.path }}" classic99.sln
          /m
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143
          /p:UseOfATL=Static
          /nologo
          /verbosity:minimal

      - name: Locate build output
        id: outdir
        shell: pwsh
        run: |
          # Win32 output lands in .\Release\, x64 lands in .\x64\Release\
          if ("${{ matrix.platform }}" -eq "Win32") {
            echo "path=Release" >> $env:GITHUB_OUTPUT
          } else {
            echo "path=x64/Release" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: classic99-${{ matrix.platform }}-release
          path: |
            ${{ steps.outdir.outputs.path }}/*.exe
            ${{ steps.outdir.outputs.path }}/*.dll
          if-no-files-found: error
